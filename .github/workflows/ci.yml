name: CI

# Checks only: no cloud credentials, nothing is published.
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Lint (ruff)
        run: pipx run ruff check .

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --only main --no-interaction --no-ansi --no-root

      - name: Django checks and places DB
        run: |
          poetry run python manage.py check
          poetry run python manage.py makemigrations --check --dry-run
          poetry run python manage.py migrate --noinput
          poetry run python manage.py luoghi_load

      - name: Translations up to date and complete
        run: |
          sudo apt-get install -y --no-install-recommends gettext
          poetry run python manage.py makemessages -l it --ignore=data --ignore=stacks --ignore=docs
          git diff -I 'POT-Creation-Date' --exit-code locale/ \
            || { echo "::error::locale/ is out of date: run makemessages and translate"; exit 1; }
          untranslated=$(msgattrib --untranslated --no-obsolete locale/it/LC_MESSAGES/django.po | grep -c '^msgid' || true)
          [ "$untranslated" -le 1 ] || { echo "::error::untranslated strings in it/django.po"; exit 1; }
          msgfmt --check -o /dev/null locale/it/LC_MESSAGES/django.po
