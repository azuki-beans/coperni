<style>
    .cerca-luogo {
        position: relative;
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .cerca-luogo input {
        width: 260px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 7px 12px;
        font-size: 13px;
        font-family: inherit;
    }

    .cerca-luogo input:focus {
        outline: none;
        border-color: var(--accent);
    }

    .cerca-luogo .centro-attuale {
        font-size: 13px;
        color: var(--text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 220px;
    }

    .cerca-luogo button {
        background: var(--bg);
        color: var(--text-dim);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
    }

    .cerca-luogo button:hover {
        color: var(--text);
    }

    #risultati-luoghi {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        width: 320px;
        z-index: 2000;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
    }

    #risultati-luoghi:empty {
        display: none;
    }

    #risultati-luoghi .risultato {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
    }

    #risultati-luoghi a.risultato:hover {
        background: var(--surface-hover);
    }

    #risultati-luoghi .risultato small {
        color: var(--text-dim);
        white-space: nowrap;
    }

    .lingue {
        display: flex;
        gap: 2px;
        margin-left: 8px;
    }

    .lingue a {
        padding: 5px 7px;
        border-radius: 6px;
        color: var(--text-dim);
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
    }

    .lingue a:hover { color: var(--text); }
    .lingue a.active { color: var(--text); background: var(--surface-hover); }

    .repo {
        display: flex;
        margin-left: 6px;
        padding: 5px;
        border-radius: 6px;
        color: var(--text-dim);
    }

    .repo:hover { color: var(--text); background: var(--surface-hover); }
    .repo svg { width: 18px; height: 18px; fill: currentColor; }

    #risultati-luoghi .vuoto {
        color: var(--text-dim);
    }

    @media (max-width: 720px) {
        header { flex-wrap: wrap; gap: 10px; }
        .nav-links { margin-left: 12px !important; }
        .cerca-luogo { width: 100%; order: 2; }
        .lingue { order: 1; margin-left: auto; }
        .repo { order: 1; }
        .cerca-luogo input { flex: 1; width: auto; }
        .cerca-luogo .centro-attuale { display: none; }
        #risultati-luoghi { left: 0; width: auto; }
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
{% load i18n %}

<header>
    <div class="logo">
        <div class="logo-icon">C</div>
        <h1>Coperni <span>{% translate "Air quality" %}</span></h1>
    </div>
    <nav class="nav-links">
        <a href="{% url 'places:map' %}?{{ centro.querystring }}" {% if nav_attiva == 'map' %}class="active"{% endif %}>{% translate "Map" %}</a>
        <a href="{% url 'places:grafici' %}?{{ centro.querystring }}" {% if nav_attiva == 'grafici' %}class="active"{% endif %}>{% translate "Charts" %}</a>
        <a href="{% url 'pagine:indice' %}?{{ centro.querystring }}" {% if nav_attiva == 'info' %}class="active"{% endif %}>{% translate "About" %}</a>
    </nav>
    <div class="cerca-luogo">
        <span class="centro-attuale" title="{% translate "Current centre" %}">{{ centro.etichetta }}</span>
        <input type="search" name="q" placeholder="{% translate "Search a town or city…" %}" autocomplete="off"
               aria-label="{% translate "Search a town or city" %}"
               hx-get="{% url 'luoghi:cerca' %}" hx-trigger="input changed delay:250ms, search"
               hx-vals='{"da": "{{ request.path }}"}' hx-target="#risultati-luoghi">
        <button type="button" id="mia-posizione" title="{% translate "Centre on my location" %}">⌖</button>
        <div id="risultati-luoghi"></div>
    </div>
    <nav class="lingue" aria-label="{% translate "Language" %}">
        {% for l in lingue_alternative %}
        <a href="{% url 'lingua' l.codice %}?next={{ request.get_full_path|urlencode }}" hreflang="{{ l.codice }}" lang="{{ l.codice }}"
           title="{{ l.nome }}" {% if l.attiva %}class="active" aria-current="true"{% endif %}>{{ l.codice }}</a>
        {% endfor %}
    </nav>
    <a class="repo" href="{{ url_repo }}" target="_blank" rel="noopener"
       title="{% translate "Source code on GitHub" %}" aria-label="{% translate "Source code on GitHub" %}">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
</header>

<script>
    // la posizione del browser diventa un normale URL con le coordinate, condivisibile
    document.getElementById('mia-posizione').addEventListener('click', () => {
        navigator.geolocation?.getCurrentPosition(pos => {
            // arrotondata a ~1 km (le celle CAMS sono di ~10 km): la posizione esatta resta nel browser
            const { latitude, longitude } = pos.coords;
            location.search = `?lat=${latitude.toFixed(2)}&lon=${longitude.toFixed(2)}`;
        });
    });
    // chiudi i risultati cliccando altrove
    document.addEventListener('click', e => {
        if (!e.target.closest('.cerca-luogo')) document.getElementById('risultati-luoghi').innerHTML = '';
    });
</script>
