{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coperni — {% translate "Air quality" %}{% endblock %}</title>
    {% include "_lingue_head.html" %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-hover: #242836;
            --border: #2e3346;
            --text: #e1e4ed;
            --text-dim: #8b90a5;
            --accent: #6c8cff;
            --radius: 10px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            padding: 14px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
        }

        .logo h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .logo h1 span {
            color: var(--text-dim);
            font-weight: 400;
            margin-left: 6px;
            font-size: 14px;
        }

        .nav-links {
            display: flex;
            gap: 4px;
            margin-left: 32px;
        }

        .nav-links a {
            padding: 6px 14px;
            border-radius: var(--radius);
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-links a:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .nav-links a.active {
            background: var(--surface-hover);
            color: var(--text);
        }

        /* ── Map ── */
        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* colore di fondo mentre i tile caricano, intonato allo sfondo scelto */
        #map[data-sfondo="dark"] { background: #0e0e0e; }
        #map[data-sfondo="light"] { background: #fafaf8; }

        /* Leaflet overrides for dark theme */
        .leaflet-control-zoom a {
            background: var(--surface) !important;
            color: var(--text) !important;
            border-color: var(--border) !important;
        }

        .leaflet-control-zoom a:hover {
            background: var(--surface-hover) !important;
        }

        .leaflet-control-attribution {
            background: rgba(15, 17, 23, 0.85) !important;
            color: var(--text-dim) !important;
            font-size: 11px !important;
        }

        .leaflet-control-attribution a {
            color: var(--accent) !important;
        }


        /* Loading spinner */
        .spinner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }

        .spinner.active {
            display: block;
        }

        .spinner-ring {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }
{% block extra_css %}{% endblock %}
    </style>
</head>
<body>

<!-- ── Header ── -->
{% include "_header.html" %}

<!-- ── Map ── -->
<div class="map-container">
    <div class="spinner" id="spinner">
        <div class="spinner-ring"></div>
    </div>
{% block overlay %}{% endblock %}
    <div id="map"></div>
</div>

{{ testi|json_script:"testi" }}
<script>
    // ── Testi tradotti (places/testi.py) e formati di data/numero della lingua della pagina ──
    const T = JSON.parse(document.getElementById('testi').textContent);
    const testo = (chiave, valori = {}) => T[chiave].replace(/\{(\w+)\}/g, (_, k) => valori[k] ?? '');
    const LOCALE = document.documentElement.lang === 'it' ? 'it-IT' : 'en-GB';

    // ── Map initialization ──
    // La mappa inquadra la finestra di celle CAMS attorno al centro scelto (dall'URL): LATO celle
    // sul lato lungo della viewport, l'altro lato in proporzione (calcolato dal server, vedi
    // copernicus/griglia.py:finestra). Qui una prima stima identica, poi i limiti esatti
    // restituiti dall'API.
    const CENTRO = [{{ centro_latitudine }}, {{ centro_longitudine }}];
    const LATI = [{% for l in lati %}{{ l }}{% if not forloop.last %}, {% endif %}{% endfor %}];

    // quota della viewport coperta dall'area dei dati: 0.95 lascia scoperto ~5% (una fascia
    // sottile sui due lati lunghi), il resto dello schermo è tutto colorato
    const RIEMPIMENTO = 0.95;

    const map = L.map('map', {
        zoomControl: true,
        attributionControl: true,
        zoomSnap: 0,   // zoom continuo: l'inquadratura resta esatta, con 0.25 verrebbe arrotondata
    });

    function aspectMappa() {
        const size = map.getSize();
        return size.x / size.y;
    }

    // stessa formula di griglia.finestra: in Mercator una cella è 1/cosφ volte più alta che larga
    function limitiStimati(lato) {
        const aspect = aspectMappa();
        const cos = Math.cos(CENTRO[0] * Math.PI / 180);
        const [nx, ny] = aspect >= 1
            ? [lato, Math.ceil(lato * cos / aspect)]
            : [Math.ceil(lato * aspect / cos), lato];
        return [[CENTRO[0] - ny * 0.05, CENTRO[1] - nx * 0.05], [CENTRO[0] + ny * 0.05, CENTRO[1] + nx * 0.05]];
    }

    function inquadra(limiti) {
        const box = L.latLngBounds(limiti);
        // inside=true → zoom minimo per cui la viewport sta DENTRO il box dei dati ("cover"):
        // l'area colorata riempie lo schermo invece di lasciare bande vuote. Il -log2 arretra
        // di un filo lo zoom per lasciare scoperto il 5%.
        const zoom = map.getBoundsZoom(box, true) + Math.log2(RIEMPIMENTO);
        map.setView(box.getCenter(), zoom, { animate: false });
    }
    inquadra(limitiStimati(LATI[0]));

    const CARTO_URL = 'https://{s}.basemaps.cartocdn.com/rastertiles/{style}/{z}/{x}/{y}.png?key={{ carto_api_key }}';
    const cartoOptions = { subdomains: 'abcd', maxZoom: 19 };

    // Sfondo chiaro o scuro (CARTO light_* / dark_*): default da CARTO_BASEMAP_STYLE, poi la
    // scelta dell'utente ricordata nel browser. Il basemap è spezzato in due tile layer: sfondo
    // senza etichette sotto, sole etichette sopra il layer inquinante (pane dedicato), così
    // toponimi e strade restano leggibili attraverso il colore.
    const SFONDI = ['dark', 'light'];
    let sfondo = '{{ carto_sfondo }}';
    try {
        const salvato = localStorage.getItem('coperni.sfondo');
        if (SFONDI.includes(salvato)) sfondo = salvato;
    } catch (e) { /* storage non disponibile: resta il default */ }

    const baseLayer = L.tileLayer(CARTO_URL, {
        ...cartoOptions,
        style: `${sfondo}_nolabels`,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    }).addTo(map);

    map.createPane('labels');
    map.getPane('labels').style.zIndex = 450;   // sopra overlayPane (400), sotto i popup (700)
    map.getPane('labels').style.pointerEvents = 'none';
    const labelsLayer = L.tileLayer(CARTO_URL, { ...cartoOptions, style: `${sfondo}_only_labels`, pane: 'labels' }).addTo(map);
    document.getElementById('map').dataset.sfondo = sfondo;

    function impostaSfondo(nome) {
        if (!SFONDI.includes(nome)) return;
        sfondo = nome;
        try { localStorage.setItem('coperni.sfondo', nome); } catch (e) {}
        baseLayer.options.style = `${nome}_nolabels`;
        labelsLayer.options.style = `${nome}_only_labels`;
        baseLayer.redraw();
        labelsLayer.redraw();
        document.getElementById('map').dataset.sfondo = nome;
    }

    function showSpinner(show) {
        document.getElementById('spinner').classList.toggle('active', show);
    }
{% block script %}{% endblock %}
</script>
</body>
</html>
