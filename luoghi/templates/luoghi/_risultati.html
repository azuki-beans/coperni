{% load i18n %}{% for r in risultati %}
<a class="risultato" href="{{ destinazione }}?{{ r.query }}">
    <span>{{ r.nome }}</span><small>{{ r.dettaglio }}</small>
</a>
{% empty %}
{% if request.GET.q|length >= 2 %}<div class="risultato vuoto">{% translate "No place found" %}</div>{% endif %}
{% endfor %}
